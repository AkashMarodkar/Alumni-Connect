{% extends "alumni_layout.html" %}
{% block content %}

<h3 class="mb-4">Edit Job Opportunity</h3>

<div class="card shadow-sm p-4">

    <form method="POST">

        <div class="row">

            <!-- Job Title -->
            <div class="col-md-6 mb-3">
                <label class="form-label">Job Title</label>
                <input type="text"
                       name="title"
                       class="form-control"
                       value="{{ job[2] }}"
                       required>
            </div>

            <!-- Company Name -->
            <div class="col-md-6 mb-3">
                <label class="form-label">Company Name</label>
                <input type="text"
                       name="company"
                       class="form-control"
                       value="{{ job[7] }}"
                       required>
            </div>

            <!-- Location -->
            <div class="col-md-6 mb-3">
                <label class="form-label">Location</label>
                <input type="text"
                       name="location"
                       class="form-control"
                       value="{{ job[8] }}">
            </div>

            <!-- Job Type -->
            <div class="col-md-6 mb-3">
                <label class="form-label">Job Type</label>
                <select name="job_type" class="form-control">

                    <option value="Full-time"
                        {% if job[9] == "Full-time" %}selected{% endif %}>
                        Full-time
                    </option>

                    <option value="Internship"
                        {% if job[9] == "Internship" %}selected{% endif %}>
                        Internship
                    </option>

                    <option value="Part-time"
                        {% if job[9] == "Part-time" %}selected{% endif %}>
                        Part-time
                    </option>

                    <option value="Remote"
                        {% if job[9] == "Remote" %}selected{% endif %}>
                        Remote
                    </option>

                </select>
            </div>

            <!-- Experience Required -->
            <div class="col-md-6 mb-3">
                <label class="form-label">Experience Required</label>
                <input type="text"
                       name="experience"
                       class="form-control"
                       value="{{ job[10] }}">
            </div>

            <!-- Salary -->
            <div class="col-md-6 mb-3">
                <label class="form-label">Salary</label>
                <input type="text"
                       name="salary"
                       class="form-control"
                       value="{{ job[11] }}">
            </div>

            <!-- Skills -->
            <div class="col-md-12 mb-3">
                <label class="form-label">Skills Required</label>
                <input type="text"
                       name="skills"
                       class="form-control"
                       value="{{ job[4] }}">
            </div>

            <!-- Description -->
            <div class="col-md-12 mb-3">
                <label class="form-label">Job Description</label>
                <textarea name="description"
                          class="form-control"
                          rows="4">{{ job[3] }}</textarea>
            </div>

            <!-- Deadline -->
            <div class="col-md-6 mb-3">
                <label class="form-label">Application Deadline</label>
                <input type="date"
                       name="deadline"
                       class="form-control"
                       value="{{ job[5].strftime('%Y-%m-%d') if job[5] else '' }}">
            </div>

        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-success">
                💾 Update Job
            </button>

            <a href="/alumni-jobs" class="btn btn-secondary ms-2">
                Cancel
            </a>
        </div>

    </form>

</div>

{% endblock %}
