{% extends "alumni_layout.html" %}
{% block content %}

<h3 class="mb-4">My Profile</h3>

<div class="card shadow-sm p-4">

    <form method="POST">

        <div class="row">

            <div class="col-md-6 mb-3">
                <label>Company</label>
                <input type="text"
                       name="company"
                       class="form-control"
                       value="{{ profile[2] if profile else '' }}">
            </div>

            <div class="col-md-6 mb-3">
                <label>Designation</label>
                <input type="text"
                       name="designation"
                       class="form-control"
                       value="{{ profile[3] if profile else '' }}">
            </div>

            <div class="col-md-6 mb-3">
                <label>Industry</label>
                <input type="text"
                       name="industry"
                       class="form-control"
                       value="{{ profile[4] if profile else '' }}">
            </div>

            <div class="col-md-6 mb-3">
                <label>Location</label>
                <input type="text"
                       name="location"
                       class="form-control"
                       value="{{ profile[5] if profile else '' }}">
            </div>

            <div class="col-md-6 mb-3">
                <label>Experience (Years)</label>
                <input type="number"
                       name="experience"
                       class="form-control"
                       value="{{ profile[6] if profile else '' }}">
            </div>

            <div class="col-md-12 mb-3">
                <label>Skills</label>
                <input type="text"
                       name="skills"
                       class="form-control"
                       value="{{ profile[7] if profile else '' }}">
            </div>

            <div class="col-md-12 mb-3">
                <label>About / Bio</label>
                <textarea name="bio"
                          class="form-control"
                          rows="4">{{ profile[8] if profile else '' }}</textarea>
            </div>

        </div>

        <button type="submit" class="btn btn-success">
            💾 Save Profile
        </button>

    </form>

</div>

{% endblock %}
