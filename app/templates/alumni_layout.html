<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body { background:#f4f6f9; font-family:'Poppins', sans-serif; }

        .sidebar {
            height:100vh;
            background:#1e1e2f;
            color:white;
            position:fixed;
            width:220px;
        }

        .sidebar a {
            display:block;
            padding:12px 15px;
            color:#cfd8dc;
            text-decoration:none;
            border-radius:6px;
        }

        .sidebar a:hover {
            background:#0d6efd;
            color:white;
        }

        .main-content {
            margin-left:220px;
            padding:30px;
        }

        .card {
            border:none;
            border-radius:15px;
        }
    </style>
</head>
<body>

<div class="sidebar p-3">
    <h5 class="text-center mb-4">Alumni Panel</h5>
    <a href="/alumni-dashboard">🏠 Dashboard</a>
    <a href="/alumni-requests">📥 Mentorship Requests</a>
    <a href="/alumni-mentees">👥 My Mentees</a>
    <a href="/alumni-jobs">💼 My Job Posts</a>
    <a href="/alumni-post-job">➕ Post New Job</a>
    <a href="/alumni-profile">👤 My Profile</a>
    <a href="/alumni-settings">⚙ Settings</a>
    <hr>
    <a href="/">🚪 Logout</a>
</div>

<div class="main-content">
    {% block content %}{% endblock %}
</div>

</body>
</html>
