{% extends "alumni_layout.html" %}
{% block content %}

<h3 class="mb-4">My Job Posts</h3>

<!-- 🔎 Filter Section -->
<div class="card shadow-sm p-3 mb-4">
    <div class="row align-items-center">

        <div class="col-md-5 mb-2">
            <input type="text"
                   id="searchInput"
                   class="form-control"
                   placeholder="Search by job title...">
        </div>

        <div class="col-md-4 mb-2">
            <select id="jobTypeSelect" class="form-control">
                <option value="">All Job Types</option>
                <option value="Full-time">Full-time</option>
                <option value="Internship">Internship</option>
                <option value="Part-time">Part-time</option>
                <option value="Remote">Remote</option>
            </select>
        </div>

        <div class="col-md-3 mb-2 text-end">
            <a href="/alumni-post-job" class="btn btn-primary">
                ➕ Post New Job
            </a>
        </div>

    </div>
</div>

<!-- 📦 Job Cards Container -->
<div class="row" id="jobContainer"></div>

<!-- 🔄 AJAX Filtering Script -->
<script>

const searchInput = document.getElementById("searchInput");
const jobTypeSelect = document.getElementById("jobTypeSelect");
const jobContainer = document.getElementById("jobContainer");

let typingTimer;
const delay = 400;

// Fetch jobs from backend
function fetchJobs() {

    const search = searchInput.value.trim();
    const jobType = jobTypeSelect.value;

    fetch(`/api/alumni-jobs?search=${encodeURIComponent(search)}&job_type=${encodeURIComponent(jobType)}`)
        .then(response => response.json())
        .then(data => {
            renderJobs(data);
        })
        .catch(error => {
            console.error("Error fetching jobs:", error);
        });
}

// Render job cards
function renderJobs(jobs) {

    jobContainer.innerHTML = "";

    if (jobs.length === 0) {
        jobContainer.innerHTML = `
            <div class="col-12">
                <div class="card shadow-sm p-5 text-center">
                    <h5>No job posts found</h5>
                    <p class="text-muted">Try adjusting your filters or post a new job.</p>
                </div>
            </div>
        `;
        return;
    }

    jobs.forEach(job => {

        jobContainer.innerHTML += `
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm p-4 h-100">

                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h5 class="fw-semibold mb-1">${job.title}</h5>
                            <small class="text-muted">${job.company}</small>
                        </div>
                        <span class="badge bg-primary">
                            ${job.job_type}
                        </span>
                    </div>

                    <hr>

                    <p class="mb-1"><strong>📍 Location:</strong> ${job.location || '-'}</p>
                    <p class="mb-1"><strong>💼 Experience:</strong> ${job.experience || '-'}</p>
                    <p class="mb-1"><strong>💰 Salary:</strong> ${job.salary || '-'}</p>
                    <p class="mb-1"><strong>🛠 Skills:</strong> ${job.skills || '-'}</p>
                    <p class="mb-2"><strong>⏳ Deadline:</strong> ${job.deadline}</p>

                    <div class="mt-3">
                        <a href="/alumni-edit-job/${job.id}"
                           class="btn btn-sm btn-outline-warning me-2">
                            ✏ Edit
                        </a>

                        <a href="/alumni-delete-job/${job.id}"
                           class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('Are you sure you want to delete this job?');">
                            🗑 Delete
                        </a>
                    </div>

                </div>
            </div>
        `;
    });
}

// Live search (with delay)
searchInput.addEventListener("keyup", function () {
    clearTimeout(typingTimer);
    typingTimer = setTimeout(fetchJobs, delay);
});

// Filter dropdown
jobTypeSelect.addEventListener("change", fetchJobs);

// Load jobs when page opens
fetchJobs();

</script>

{% endblock %}
